<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sarvesh Suhas Kute. Systems, Databases, Networking">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#000000"/></linearGradient>
<style>
.f{font-family:'Segoe UI',Helvetica,Arial,sans-serif;text-anchor:middle}
.a{animation:in 1s ease backwards}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.w1{animation:s 9s ease-in-out infinite alternate}
.w2{animation:s 12s ease-in-out infinite alternate-reverse}
@keyframes s{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
</style>
<clipPath id="c"><rect width="1200" height="300"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1200" height="300" fill="url(#g)"/>
<path class="w2" d="M-80 250 C 150 210, 350 270, 600 240 S 1000 215, 1280 250 L1280 300 L-80 300Z" fill="#000000" fill-opacity=".55"/>
<path class="w1" d="M-80 268 C 200 240, 420 285, 640 262 S 1020 245, 1280 270 L1280 300 L-80 300Z" fill="#000000"/>
<g class="f">
<text class="a" x="600" y="140" font-size="62" font-weight="800" fill="#ffffff" style="animation-delay:.2s">Sarvesh Suhas Kute</text>
<text class="a" x="600" y="190" font-size="26" font-weight="600" fill="#9da7b3" style="animation-delay:.7s">Systems | Databases | Networking</text>
</g></g></svg>
