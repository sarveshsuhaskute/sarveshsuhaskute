<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="About Sarvesh: B.Tech CSE at VIT Vellore, builds systems, databases and ML. Software engineering intern at Supertech."><defs><style>.l{font-family:Menlo,Consolas,'DejaVu Sans Mono',monospace;animation:i .4s backwards}@keyframes i{from{opacity:0}}</style></defs><rect width="1200" height="350" rx="12" fill="#0f0a1f" stroke="#2e1f4d"/><rect width="1200" height="40" rx="12" fill="#1c1530"/><rect y="28" width="1200" height="12" fill="#1c1530"/><circle cx="24" cy="20" r="6" fill="#ff5f56"/><circle cx="46" cy="20" r="6" fill="#ffbd2e"/><circle cx="68" cy="20" r="6" fill="#27c93f"/><text class="l" x="28" y="86" font-size="17" fill="#a78bfa" style="animation-delay:0.0s">$ cat about.txt</text><text class="l" x="28" y="116" font-size="17" fill="#f3e8ff" style="animation-delay:0.5s">B.Tech CSE at VIT Vellore, CGPA 9.36.</text><text class="l" x="28" y="146" font-size="17" fill="#cbd5e1" style="animation-delay:1.0s">Most projects start with a question:</text><text class="l" x="28" y="176" font-size="17" fill="#ddd6fe" style="animation-delay:1.5s">  how does a DNS server answer a query?</text><text class="l" x="28" y="206" font-size="17" fill="#ddd6fe" style="animation-delay:2.0s">  how does Linux decide what to cache?</text><text class="l" x="28" y="236" font-size="17" fill="#ddd6fe" style="animation-delay:2.5s">  how do you stop a seat being booked twice?</text><text class="l" x="28" y="266" font-size="17" fill="#a78bfa" style="animation-delay:3.0s">$ ./status --now</text><text class="l" x="28" y="296" font-size="17" fill="#f3e8ff" style="animation-delay:3.5s">SWE intern @ Supertech: 850ms -> 120ms on 500k+ rows.</text></svg>